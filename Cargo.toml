[package]
# The crate is mullmd (mull is taken on crates.io); the command and the
# library are still called mull.
name = "mullmd"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A keyboard-driven mind mapper for the terminal, with plain Markdown files"
repository = "https://github.com/bricef/mull"
readme = "README.md"
keywords = ["mind-map", "markdown", "tui", "terminal", "outline"]
categories = ["command-line-utilities", "text-editors"]
include = ["/src", "/tests", "/README.md", "/LICENSE*"]

[lib]
name = "mull"
path = "src/lib.rs"

[[bin]]
name = "mull"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
markdown = "1.0.0"
ratatui = "0.30.2"
tempfile = "3.27.0"
unicode-width = "0.2.2"

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.12.0"

# Release binaries: smaller and a little faster, at the cost of build time.
[profile.release]
lto = true
codegen-units = 1
strip = true
